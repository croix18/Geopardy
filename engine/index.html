<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<style>{{include vendor/fonts.css}}</style>
<style>{{include vendor/katex.css}}</style>
<style>{{include style.css}}</style>
</head><body>
<div id="app"></div>
<div id="print"></div>
<!-- Bell schedule copied from Deckhand. Times use school convention: 6:00-11:59 = AM, 12:00-5:59 = PM. Hand-editable. -->
<script type="application/json" id="schedule">{{include schedule.json}}</script>
<script type="application/json" id="unit">{{unit}}</script>
<script type="application/octet-stream" id="au_k545">{{audio audio/k545.mp3}}</script>
<script type="application/octet-stream" id="au_finale">{{audio audio/finale.mp3}}</script>
<script type="application/octet-stream" id="au_menuetto">{{audio audio/menuetto.mp3}}</script>

<script id="engine">{{include quizmusic.js}}</script>
<script>{{include vendor/katex.min.js}}</script>
<script>{{include game.js}}</script>
</body></html>
